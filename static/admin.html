<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Выгрузка данных</title>
  <style>
    body { font-family: Arial, sans-serif; background: #EDF0F3; color: #12263F; margin: 0; }
    main { max-width: 420px; margin: 60px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #C9D1DA; border-radius: 10px; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    input, button { width: 100%; min-height: 48px; font-size: 18px; border-radius: 6px; box-sizing: border-box; }
    input { border: 1.5px solid #C9D1DA; padding: 10px 14px; margin-bottom: 12px; }
    button { background: #F5B800; color: #12263F; border: 0; font-weight: 600; cursor: pointer; }
    #msg { color: #C62828; min-height: 1.5em; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Выгрузка участников</h1>
      <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
      <button id="dl">Скачать таблицу</button>
      <p id="msg"></p>
    </div>
  </main>

  <script>
    const pw = document.getElementById("pw");
    const msg = document.getElementById("msg");

    async function download() {
      msg.textContent = "";
      const res = await fetch("/export", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "password=" + encodeURIComponent(pw.value)
      });

      if (!res.ok) {
        msg.textContent = "Неверный пароль";
        return;
      }

      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "participants.csv";
      a.click();
      URL.revokeObjectURL(a.href);
      pw.value = "";
    }

    document.getElementById("dl").onclick = download;
    pw.addEventListener("keydown", e => { if (e.key === "Enter") download(); });
  </script>
</body>
</html>
