<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Твоя профессия на железной дороге</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>

:root {
  --bg: #EDF0F3;
  --card: #FFFFFF;
  --ink: #12263F;
  --muted: #5C6B7C;
  --line: #C9D1DA;
  --signal: #F5B800;
  --signal-ink: #12263F;
  --hover: #F3F6F9;
  --sleeper: #9AA6B3;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1626;
    --card: #14233A;
    --ink: #EAF0F7;
    --muted: #9FB0C3;
    --line: #2B3D57;
    --hover: #1A2D49;
    --sleeper: #4B5E78;
  }
}

:root[data-theme="dark"] {
  --bg: #0C1626;
  --card: #14233A;
  --ink: #EAF0F7;
  --muted: #9FB0C3;
  --line: #2B3D57;
  --hover: #1A2D49;
  --sleeper: #4B5E78;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: 18px;
  line-height: 1.5;
}

h1,
h2,
.q {
  font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  font-weight: 700;
  line-height: 1.1;
  margin: 0;
}

h1 {
  font-size: clamp(38px, 8vw, 60px);
}

h2 {
  font-size: clamp(34px, 7vw, 52px);
  margin-bottom: 12px;
}

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 48px;
  min-height: 100vh;
  min-height: 100dvh;
}

.hidden {
  display: none;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 28px 24px;
}

.lead {
  color: var(--muted);
  margin: 16px 0 24px;
  max-width: 56ch;
}

.lead--flush {
  margin-top: 0;
}

.btn {
  min-height: 48px;
  font: 600 18px 'Barlow', Arial, sans-serif;
  background: var(--signal);
  color: var(--signal-ink);
  border: 0;
  border-radius: 6px;
  padding: 14px 26px;
  cursor: pointer;
}

.btn.ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}

button:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 3px;
}

@media (hover: hover) {
  .btn:hover {
    filter: brightness(.95);
  }
}

.jobs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 28px;
  padding: 0;
  list-style: none;
}

.jobs li {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 16px;
}

.track {
  position: relative;
  height: 44px;
  margin-bottom: 22px;
}

.rails {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 6px;
  height: 12px;
  border-top: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
  background: repeating-linear-gradient(90deg, var(--sleeper) 0 6px, transparent 6px 20px);
  background-size: auto 100%;
}

.train {
  position: absolute;
  bottom: 14px;
  left: 0;
  font-size: 30px;
  line-height: 1;
  transform: translateX(0);
  transition: left .5s ease;
}

.count {
  color: var(--muted);
  font-size: 16px;
  margin-bottom: 8px;
}

.q {
  font-size: clamp(28px, 6vw, 38px);
  margin-bottom: 20px;
}

.opts {
  display: grid;
  gap: 10px;
}

.opt {
  width: 100%;
  min-height: 56px;
  text-align: left;
  font: 500 18px/1.35 'Barlow', Arial, sans-serif;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
}

.opt:active {
  background: var(--hover);
  border-color: var(--ink);
}

@media (hover: hover) {
  .opt:hover {
    background: var(--hover);
    border-color: var(--ink);
  }
}

.nav {
  margin-top: 20px;
}

.badge {
  display: inline-block;
  background: var(--signal);
  color: var(--signal-ink);
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 16px;
  margin-bottom: 14px;
}

.also {
  color: var(--muted);
  margin-top: 18px;
}

.bars {
  margin: 26px 0;
  display: grid;
  gap: 12px;
}

.bar-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px;
  gap: 4px 10px;
  align-items: center;
  font-size: 16px;
}

.bar-row b {
  text-align: right;
}

.bar {
  grid-column: 1 / -1;
  height: 10px;
  background: var(--hover);
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--ink);
}

.bar-row.top .bar i {
  background: var(--signal);
}

@media (min-width: 900px) {
  body {
    font-size: 20px;
  }

  main {
    max-width: 820px;
    padding: 56px 24px 72px;
  }

  .card {
    padding: 44px 48px;
  }

  .opts {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .opt {
    font-size: 19px;
    padding: 18px 20px;
  }
}

@media (max-width: 480px) {
  body {
    font-size: 17px;
  }

  main {
    padding: 12px 12px 32px;
  }

  .card {
    padding: 20px 16px;
  }

  .btn {
    width: 100%;
  }

  .opt {
    font-size: 17px;
    padding: 14px;
  }

  .jobs li {
    font-size: 15px;
  }
}

@media (max-height: 480px) and (orientation: landscape) {
  main {
    padding-top: 10px;
  }

  .track {
    margin-bottom: 10px;
  }

  .q {
    margin-bottom: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .train {
    transition: none;
  }
}

.fields {
  display: grid;
  gap: 12px;
  margin: 0 0 20px;
}

.fields label {
  display: grid;
  gap: 4px;
  font-size: 16px;
  color: var(--muted);
}

.fields input,
.fields select {
  width: 100%;
  min-height: 48px;
  font: 500 18px 'Barlow', Arial, sans-serif;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
}

.fields input:focus-visible,
.fields select:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.error {
  color: #C62828;
  margin: 12px 0 0;
  min-height: 1.5em;
  font-size: 16px;
}
  </style>

</head>

<body>
  <main>

    <section id="start" class="card">
      <h1>Какая профессия на железной дороге тебе подходит?</h1>
      <p class="lead"></p>

      <ul class="jobs" aria-label="Специальности">
        <li>Вагонник</li>
        <li>Строитель железных дорог</li>
        <li>Организатор перевозок</li>
        <li>Программист</li>
        <li>Машинист локомотива</li>
      </ul>

      <div class="fields" id="fields">
        <label>ФИО
          <input id="fio" type="text" autocomplete="name" placeholder="Иванов Иван Иванович">
        </label>
        <label>Школа
          <select id="school"><option value="">Выберите образовательную организацию</option></select>
        </label>
        <label>Телефон (необязательно)
          <input id="phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00">
        </label>
      </div>

      <button class="btn" id="go" disabled>Начать тест</button>
      <p class="error" id="error" role="alert"></p>
    </section>

    <section id="quiz" class="card hidden" aria-live="polite">
      <div class="track" aria-hidden="true">
        <div class="rails"></div>
        <div class="train" id="train">🚆</div>
      </div>

      <div class="count" id="count"></div>
      <h2 class="q" id="qtext"></h2>
      <div class="opts" id="opts"></div>

      <div class="nav">
        <button class="btn ghost" id="back">Назад</button>
      </div>
    </section>

    <section id="result" class="card hidden">
      <span class="badge">Твой результат</span>
      <h2 id="rtitle"></h2>
      <p id="rdesc" class="lead lead--flush"></p>
      <p><b>Чему учат:</b> <span id="rlearn"></span></p>
      <p class="also" id="ralso"></p>

      <div class="bars" id="bars"></div>

      <button class="btn" id="again">Пройти заново</button>
    </section>

  </main>

  <script>

const JOBS = {
  V: {
    name: "Вагонник",
    desc: "Ты любишь разбираться, как всё устроено, и доводить технику до идеального состояния. Вагонник отвечает за то, чтобы каждый вагон был исправен и безопасен.",
    learn: "осмотр и ремонт вагонов, тележек, тормозов и автосцепки, диагностика неисправностей."
  },

  S: {
    name: "Строитель железных дорог",
    desc: "Тебе важно видеть результат своего труда и работать в команде на открытом воздухе. Строители прокладывают и поддерживают пути, мосты и станции.",
    learn: "строительство и содержание пути, геодезия, работа с путевой техникой."
  },

  O: {
    name: "Организатор перевозок и управления",
    desc: "У тебя организаторский склад: ты умеешь планировать, координировать и быстро принимать решения. Именно так строится график движения поездов.",
    learn: "диспетчерское управление, планирование перевозок, работа станции и грузовые и пассажирские перевозки."
  },

  P: {
    name: "Программист",
    desc: "Ты мыслишь логически и любишь решать задачи с помощью кода. На железной дороге программисты создают системы учёта, билетов, автоматики и безопасности.",
    learn: "разработка программ, базы данных, сети и информационные системы для транспорта."
  },

  L: {
    name: "Машинист локомотива",
    desc: "Ты внимателен, хладнокровен и готов нести ответственность за поезд и пассажиров. Машинист ведёт состав и управляет мощной техникой.",
    learn: "устройство локомотивов, управление поездом, правила безопасности движения."
  }
};

const Q = [
  ["Чем тебе интереснее заниматься в свободное время?", [
    ["Разбирать и чинить технику", "V"],
    ["Строить что-то своими руками", "S"],
    ["Планировать маршруты и расписания", "O"],
    ["Писать код или делать игры", "P"]
  ]],
  ["Какое рабочее место тебе нравится больше всего?", [
    ["Кабина с панелью приборов", "L"],
    ["Цех или депо с техникой", "V"],
    ["Диспетчерский пункт с большими экранами", "O"],
    ["Офис с компьютером", "P"]
  ]],
  ["Что для тебя важнее всего в работе?", [
    ["Ответственность за поезд и людей", "L"],
    ["Видеть построенный результат", "S"],
    ["Порядок и чёткая организация", "O"],
    ["Решение сложных логических задач", "P"]
  ]],
  ["За окном дождь. Что ты выберешь?", [
    ["Работу на улице, меня это не пугает", "S"],
    ["Тёплый цех с вагонами", "V"],
    ["Пульт управления в помещении", "O"],
    ["Кабину локомотива", "L"]
  ]],
  ["Какой школьный предмет тебе ближе?", [
    ["Информатика", "P"],
    ["Технология и черчение", "V"],
    ["Физика", "L"],
    ["Геометрия и география", "S"]
  ]],
  ["Как ты ведёшь себя в стрессовой ситуации?", [
    ["Сохраняю спокойствие и действую по инструкции", "L"],
    ["Быстро распределяю задачи между людьми", "O"],
    ["Ищу причину неисправности", "V"],
    ["Анализирую и ищу ошибку в логике", "P"]
  ]],
  ["Как тебе удобнее работать?", [
    ["В бригаде, когда все делают общее дело", "S"],
    ["Руковожу и координирую других", "O"],
    ["Сосредоточенно управляю техникой", "L"],
    ["Самостоятельно над своей задачей", "P"]
  ]],
  ["Что ты хотел бы узнать?", [
    ["Как устроены тормоза и тележка вагона", "V"],
    ["Как укладывают рельсы и строят насыпь", "S"],
    ["Как составляют график движения поездов", "O"],
    ["Как работают системы автоматики и программы", "P"]
  ]],
  ["Как ты относишься к физической нагрузке?", [
    ["Не боюсь тяжёлой работы на воздухе", "S"],
    ["Готов работать с инструментом, в том числе под вагоном", "V"],
    ["Предпочитаю умственную работу", "P"],
    ["Могу долго сидеть, сохраняя внимание", "L"]
  ]],
  ["Что тебя привлекает на железной дороге?", [
    ["Мощь локомотива и скорость", "L"],
    ["Масштаб путей и мостов", "S"],
    ["Цифровизация и умные системы", "P"],
    ["Мощные и надёжные вагоны", "V"]
  ]],
  ["Как ты относишься к сменному графику?", [
    ["Готов к сменам ради работы на поезде", "L"],
    ["Хочу работать в цеху в дневное время", "V"],
    ["Согласен ездить на объекты, вахтой", "S"],
    ["Согласен на дежурства в диспетчерской", "O"]
  ]],
  ["Какая задача тебе интереснее?", [
    ["Найти и устранить неисправность буксы", "V"],
    ["Рассчитать и проложить участок пути", "S"],
    ["Организовать отправку поездов без задержек", "O"],
    ["Написать программу для учёта вагонов", "P"]
  ]],
  ["Какое качество у себя ты ценишь больше всего?", [
    ["Аккуратность и техническая смекалка", "V"],
    ["Внимательность и быстрая реакция", "L"],
    ["Организованность и умение общаться", "O"],
    ["Выносливость и трудолюбие", "S"]
  ]],
  ["Какой инструмент тебе ближе?", [
    ["Гаечный ключ и дефектоскоп", "V"],
    ["Теодолит и путевая техника", "S"],
    ["Рация и график движения", "O"],
    ["Клавиатура и среда разработки", "P"]
  ]],
  ["Кем ты видишь себя через 10 лет?", [
    ["Машинистом, ведущим поезд", "L"],
    ["Начальником строительного участка", "S"],
    ["Начальником станции или диспетчером", "O"],
    ["Разработчиком систем для железной дороги", "P"]
  ]]
];

const $ = id => document.getElementById(id);

let i = 0;
let answers = [];

function show(id) {
  ["start", "quiz", "result"].forEach(s => {
    $(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo(0, 0);
}

function render() {
  const [text, options] = Q[i];

  $("count").textContent = "Вопрос " + (i + 1) + " из " + Q.length;
  $("qtext").textContent = text;

  const box = $("opts");
  box.innerHTML = "";

  options.forEach(([label, key]) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = label;
    btn.onclick = () => {
      answers[i] = key;
      next();
    };
    box.appendChild(btn);
  });

  $("back").style.visibility = i ? "visible" : "hidden";

  const train = $("train");
  const free = train.parentElement.clientWidth - train.offsetWidth;
  train.style.left = Math.round(free * (i / Q.length)) + "px";
}

function next() {
  i++;
  if (i < Q.length) {
    render();
  } else {
    finish();
  }
}

function finish() {

  const score = { V: 0, S: 0, O: 0, P: 0, L: 0 };
  answers.forEach(key => score[key]++);

  const order = Object.keys(score).sort((a, b) => score[b] - score[a]);
  const top = order[0];
  const job = JOBS[top];

  $("rtitle").textContent = job.name;
  $("rdesc").textContent = job.desc;
  $("rlearn").textContent = job.learn;

  const tied = order.filter(k => k !== top && score[k] === score[top]);
  const second = order[1];

  // сохраняем результат (при равенстве - все подходящие профессии)
  fetch("/result", {
    method: "POST",
    body: JSON.stringify({
      participant_id: Number(sessionStorage.getItem("participant_id")),
      profession: [top, ...tied].map(k => JOBS[k].name).join(" / ")
    })
  }).then(res => {
    if (!res.ok) {
      // сервер не знает этого участника: сбросим, чтобы форма показалась снова
      sessionStorage.removeItem("participant_id");
      console.error("Результат не сохранён:", res.status);
    }
  }).catch(() => {});

  if (tied.length) {
    $("ralso").textContent =
      "Результат почти равный: тебе также подходит — " +
      tied.map(k => JOBS[k].name).join(", ") + ".";
  } else if (score[second] > 0) {
    $("ralso").textContent = "Второй по близости вариант — " + JOBS[second].name + ".";
  } else {
    $("ralso").textContent = "";
  }

  const bars = $("bars");
  bars.innerHTML = "";

  order.forEach(key => {
    const percent = Math.round(score[key] / Q.length * 100);
    const row = document.createElement("div");

    row.className = "bar-row" + (score[key] === score[top] ? " top" : "");
    row.innerHTML =
      "<span>" + JOBS[key].name + "</span>" +
      "<b>" + percent + "%</b>" +
      "<div class='bar'><i style='width:" + percent + "%'></i></div>";

    bars.appendChild(row);
  });

  show("result");
}

// список школ для выпадающего меню
fetch("/schools")
  .then(r => r.json())
  .then(list => {
    list.forEach(s => $("school").add(new Option(s.name, s.id)));
  })
  .catch(() => {
    $("error").textContent = "Не удалось загрузить список школ. Обновите страницу.";
  });

// если человек уже вводил данные, при повторном прохождении форму не показываем
function updateFields() {
  $("fields").classList.toggle("hidden", !!sessionStorage.getItem("participant_id"));
  updateButton();
}

// кнопка активна, только если введено ФИО и выбрана школа
function updateButton() {
  const registered = !!sessionStorage.getItem("participant_id");
  const ready = $("fio").value.trim() !== "" && $("school").value !== "";
  $("go").disabled = !(registered || ready);
}

$("fio").addEventListener("input", updateButton);
$("school").addEventListener("change", updateButton);

// +7..., 7..., 8... и 10 цифр -> +7XXXXXXXXXX; пустой номер допустим
function normalizePhone(s) {
  let d = s.replace(/\D/g, "");
  if (d === "") return "";
  if (d.length === 11 && (d[0] === "7" || d[0] === "8")) d = d.slice(1);
  return d.length === 10 ? "+7" + d : null;
}

updateFields();

function startQuiz() {
  i = 0;
  answers = [];
  show("quiz");
  render();
}

$("go").onclick = async () => {
  $("error").textContent = "";

  if (sessionStorage.getItem("participant_id")) {
    startQuiz();
    return;
  }

  const fio = $("fio").value.trim();
  const schoolId = Number($("school").value);

  if (!fio) {
    $("error").textContent = "Введите ФИО";
    return;
  }
  if (!schoolId) {
    $("error").textContent = "Выберите образовательную организацию";
    return;
  }

  const phone = normalizePhone($("phone").value);
  if (phone === null) {
    $("error").textContent = "Проверьте номер телефона";
    return;
  }

  $("go").disabled = true;
  try {
    const res = await fetch("/start", {
      method: "POST",
      body: JSON.stringify({
        full_name: fio,
        school_id: schoolId,
        phone: phone
      })
    });
    const data = await res.json();

    if (!res.ok) {
      $("error").textContent = data.error || "Ошибка, попробуйте ещё раз";
      return;
    }
    sessionStorage.setItem("participant_id", data.participant_id);
    updateFields();
    startQuiz();
  } catch (e) {
    $("error").textContent = "Нет связи с сервером. Попробуйте ещё раз.";
  } finally {
    $("go").disabled = false;
  }
};

$("back").onclick = () => {
  if (i > 0) {
    i--;
    render();
  }
};

$("again").onclick = () => {
  sessionStorage.removeItem("participant_id");
  $("fio").value = "";
  $("phone").value = "";
  $("school").value = "";
  updateFields();
  show("start");
};

window.addEventListener("resize", () => {
  if (!$("quiz").classList.contains("hidden")) {
    render();
  }
});
  </script>
</body>

</html>
